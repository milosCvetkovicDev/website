packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 runs no dependency lifecycle scripts unless the package is allowed here, and warns about
# every package it skipped. `false` records a deliberate denial and silences that warning, `true`
# would approve the script. Read docs/adr/0007-dependency-build-scripts.md before adding or
# flipping an entry. A node_modules installed before an entry existed keeps reporting the package
# until it is recreated (`pnpm clean && pnpm install`).
allowBuilds:
  # Checks the @esbuild/<platform> binary pnpm already installed and downloads one only if it is
  # missing. Reviewed at 0.27.2.
  esbuild: false
  # No-op unless a global libvips is found, in which case it compiles from source. Optional
  # dependency of next for next/image. Reviewed at 0.34.5.
  sharp: false
  # Checks the @unrs/resolver-binding-<platform> binary and downloads one only if it is missing.
  # Reviewed at 1.11.1.
  unrs-resolver: false
