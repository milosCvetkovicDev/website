packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 refuses dependency install scripts by default and warns about the ones it skipped.
# These three ship prebuilt binaries as optional platform packages, so their scripts are only
# fallbacks (validate the binary, or compile from source when no binary matched). Denying them
# keeps `pnpm install` script-free and silences the warning. See docs/adr/0007.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
