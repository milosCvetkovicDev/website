name: Commit messages

# commitlint ran only in .husky/commit-msg, which the squash commits GitHub writes to `main` never
# pass through. Four commits on `main` since commitlint arrived in #3, #3's own included, already
# fail the repository's own convention because of it. This lints what reaches `main`: before the
# merge, the pull request title as the squash commit's subject and every commit on the branch; after
# it, every commit a push lands on `main`. Only that last lint sees a squash body typed in the merge
# dialog, because no pull request event carries it.
#
# A workflow of its own rather than a step in ci.yml: a title edit then re-runs this alone instead
# of the build and the e2e suite, and ci.yml keeps exactly the gates the docs list for its two jobs.
#
# No `workflow_dispatch`: a manual run has no title and no commit range, so every lint step below
# would be skipped and the job would still report green on whatever SHA it ran against.

on:
  pull_request:
    # `edited` covers a retitle. It also fires for a body or base edit, and those re-run the whole job
    # on purpose: see the note on the job below.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# PRs: cancel superseded runs. main: never cancel, every commit gets full results. A run cancelled by
# a newer event on the same PR is always followed by that newer run, which lints the same title and
# commits in full, so cancelling never leaves a PR without a real result.
concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Branch protection binds required checks to this display name, so it does not change.
  #
  # Deliberately no job-level `if` to skip body-only edits. GitHub reports a job skipped by a
  # condition as Success on the head SHA, and a skipped job satisfies a required check. A skip would
  # therefore turn a failing title green without linting it: open a PR titled `update stuff`, watch
  # this fail, edit only the body, and the newest `Commit messages` result on that SHA is a pass. The
  # concurrency group made it worse, because the skipped run joined the group before its `if` was
  # evaluated and cancelled a real lint still in progress. Re-linting on every edit costs well under
  # a minute and is always correct.
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint walks a commit range, so the whole history has to be there.
          fetch-depth: 0

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint the pull request title
        if: github.event_name == 'pull_request'
        # The title is attacker-controlled input, so it arrives through the environment and is never
        # interpolated into the script; the number comes the same way. `printf` rather than `echo`,
        # which would eat a leading `-`.
        #
        # Linted twice, and the second runs even when the first fails. Once as the squash commit's
        # subject reads on `main`, where GitHub appends ` (#NN)`: the suffix alone can push a title
        # that passes as written over `header-max-length`. And once as written, because the suffix
        # hides the rules that read the end of the header: `feat: add thing.` fails
        # `subject-full-stop`, `feat: add thing. (#NN)` passes.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=0
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose || status=1
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | pnpm exec commitlint --verbose || status=1
          exit "$status"

      - name: Lint every commit on the branch
        # `!cancelled()` so a failing title does not skip this step and hide a second failure. The
        # install outcome keeps a failed install, or anything before it, from being reported here a
        # second time as a missing commitlint. The expression is wrapped because a bare `if:` that
        # starts with `!` is a YAML tag, not a string.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Lint every commit pushed to main
        if: github.event_name == 'push'
        # Every commit the push landed, from the previous tip of `main` to the new one. While squash
        # is the only merge method enabled that is one commit, but a push that lands several is
        # linted in full rather than only its last. The commits on `main` that predate this check,
        # 28 of which fail it, sit behind the first `before` and are never linted: `main` is never
        # rewritten, so the range is deliberately not the whole history.
        #
        # `before` is all zeros when the push created the branch. There is no previous tip then, and
        # `--from` would reject it as an invalid revision, so only the new tip is linted, from its
        # full message (`HEAD~1` would not exist for a root commit). `^0+$` rather than forty zeros,
        # so a SHA-256 repository matches too.
        #
        # A `before` that is not hex, an empty one included, fails first: commitlint reads
        # `--from ""` as no `--from` at all and lints the whole history, which fails on the old
        # commits for the wrong reason. `pipefail` because the default `bash -e` reports only the
        # last command of a pipeline, so a failing `git log` would otherwise be judged by commitlint
        # on empty input.
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]+$ ]]; then
            echo "::error::github.event.before is not a commit SHA: '$BEFORE_SHA'"
            exit 1
          fi
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git log -1 --format=%B "$AFTER_SHA" | pnpm exec commitlint --verbose
          else
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose
          fi
