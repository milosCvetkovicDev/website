name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PRs: cancel superseded runs. main: never cancel, every commit gets full results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    # Required-check name: main's branch protection requires this exact string (ADR 0021).
    # Renaming the job strands that check and blocks every PR until the protection is updated.
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review (pull requests only)
        # Fails a pull request that introduces a dependency with a known advisory (ADR 0018), before
        # anything is installed, at the action's defaults: any severity, `runtime` scope. GitHub's
        # dependency graph scopes every pnpm-lock.yaml entry `runtime`, dev tooling included, so
        # every version added to the lockfile is checked. A push to main has no base to compare
        # with, so it is skipped there. Default, non-commenting mode: the workflow's
        # `contents: read` is all it needs.
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check allowBuilds entries against the lockfile
        run: pnpm check:allowbuilds

      - name: Check ADR records against their index
        run: pnpm check:adrs

      - name: Root script tests
        run: pnpm test:scripts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check the build output is function-free
        # Reads the manifests and prerendered bodies the Build step left in apps/web/.next, so it has
        # to come after it; its parsing is tested with the other scripts in `pnpm test:scripts`. A
        # route handler without `export const dynamic = 'force-static'` still serves the right
        # bytes, as a server function: this step is what notices (scripts/check-build-output.mjs).
        run: pnpm check:build-output

  e2e:
    # Required-check name: main's branch protection requires this exact string (ADR 0021).
    # Renaming the job strands that check and blocks every PR until the protection is updated.
    name: End-to-end (Playwright against the production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Key the apt archive cache
        id: apt-key
        # The system packages `playwright install --with-deps` adds depend on the runner's OS
        # release and architecture and on the Playwright version, so those make the key (#210). The
        # month comes last, so an exact hit is replaced at least monthly and the packages Ubuntu has
        # updated since are not downloaded on every run; the restore keys fall back to this
        # version's newest entry, then to any for this OS. pnpm can print a notice before
        # Playwright's `Version x.y.z` line, hence the match. Runner facts only, no event data.
        shell: bash
        run: |
          . /etc/os-release
          version="$(pnpm --filter web exec playwright --version | sed -n 's/^Version \([0-9][0-9A-Za-z.-]*\)$/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::Could not read the Playwright version for the apt archive cache key"
            exit 1
          fi
          prefix="playwright-apt-${ID:?}${VERSION_ID:?}-$(dpkg --print-architecture)-"
          {
            echo "prefix=$prefix"
            echo "version=$version"
            echo "key=$prefix$version-$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the apt archive cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          restore-keys: |
            ${{ steps.apt-key.outputs.prefix }}${{ steps.apt-key.outputs.version }}-
            ${{ steps.apt-key.outputs.prefix }}

      - name: Seed apt's archive directory
        # apt installs a file it finds in /var/cache/apt/archives under the expected name whenever
        # the size matches the index, without hashing it (pkgAcqArchive in apt 2.7 and 3.1). So a
        # restored archive goes there only when its SHA-256 is the one the signed index, refreshed
        # first, lists for that package and version: a stale or tampered one is downloaded again,
        # never installed. An empty or missing cache seeds nothing.
        shell: bash
        run: |
          shopt -s nullglob
          debs=(~/.cache/playwright-apt-archives/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "No cached archives to seed."
            exit 0
          fi
          sudo apt-get update
          seeded=0
          for deb in "${debs[@]}"; do
            IFS=_ read -r name version _ <<< "$(basename "$deb" .deb)"
            sum="$(sha256sum < "$deb" | cut -d ' ' -f 1)"
            records="$(apt-cache show "$name=${version//%3a/:}" 2>/dev/null || true)"
            if grep -qxF "SHA256: $sum" <<< "$records"; then
              sudo cp "$deb" /var/cache/apt/archives/
              seeded=$((seeded + 1))
            fi
          done
          echo "Seeded $seeded of ${#debs[@]} cached archives; apt downloads the rest."

      - name: Install Playwright browsers
        # webkit as well as chromium: the two phone projects in apps/web/playwright.config.ts are
        # Pixel 7 (chromium) and iPhone 13 (webkit). A missing browser makes the whole suite fail in
        # milliseconds, so a run that dies immediately after a Playwright bump is this step, not a
        # broken spec.
        #
        # The slow part is not the browsers, about 11 s from Playwright's CDN, but the ~125 MB of
        # system packages `--with-deps` fetches through apt: a slow mirror once took 11 minutes of
        # the job's 20 over them (#210), which is why the steps around this one cache the archives.
        run: pnpm --filter web exec playwright install --with-deps chromium webkit

      - name: Collect the downloaded archives
        id: apt-collect
        # Skipped on an exact hit, which has nothing new to save. `autoclean` first drops the
        # archives the index no longer offers, such as a restored version Ubuntu has since replaced,
        # so the entry does not grow with dead versions. The cache directory is emptied, so what is
        # saved is what apt kept: archives it checked on download and the ones the seed step
        # checked. apt's `partial/` and lock stay behind.
        if: steps.apt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get autoclean
          cache=~/.cache/playwright-apt-archives
          rm -rf "$cache"
          mkdir -p "$cache"
          shopt -s nullglob
          debs=(/var/cache/apt/archives/*.deb)
          if [ "${#debs[@]}" -eq 0 ]; then
            echo "::warning::apt kept no archives in /var/cache/apt/archives, so there is nothing to cache (#210)"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo cp "${debs[@]}" "$cache"/
          sudo chown -R "$(id -u):$(id -g)" "$cache"
          echo "Collected ${#debs[@]} archives."
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Save the apt archive cache
        # Before the build and the tests, because the combined actions/cache saves only when the
        # whole job succeeds: a run cancelled during the tests, the case #210 is about, would never
        # save what it downloaded. Another run saving the same key first is a warning, not a failure.
        if: steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-collect.outputs.found == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Build web
        run: pnpm --filter web build

      - name: Run e2e tests
        id: e2e
        # The suite defaults to 3210, which keeps a developer machine's :3000 out of it; on a runner
        # nothing else is listening, so CI stays on the conventional port (ADR 0014).
        #
        # `shell: bash` for `pipefail`, which the default `bash -e {0}` does not set: without it the
        # pipe into `tee` would report tee's status and turn a failing Playwright run green. The log
        # is captured because nothing in the suite reads what the web server printed, and the step
        # below is what reads it.
        shell: bash
        env:
          PLAYWRIGHT_PORT: '3000'
        run: pnpm --filter web test:e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Check the web server's log
        # Runs whenever the suite ran, passed or failed, so a server error is reported beside a test
        # failure rather than hidden behind it. Keyed on the e2e step's own outcome rather than on
        # `failure()`: when an earlier step (install, browsers, build) fails, the suite never ran and
        # no log exists, and a second red step saying so would only point away from the real cause.
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        run: node scripts/check-webserver-log.mjs "$RUNNER_TEMP/e2e.log"

      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
