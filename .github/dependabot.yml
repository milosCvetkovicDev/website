version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # The same one-day window as `minimumReleaseAge` in pnpm-workspace.yaml, so that the bot never
    # proposes a version pnpm would refuse to install. `cooldown` covers version updates only, not
    # security updates, which is the behaviour this repository wants: a security fix should arrive
    # the day it is published.
    cooldown:
      default-days: 1
    # Majors that cannot pass this repository's gates, so that a failing pull request does not
    # reopen every release and hold one of the five slots a security fix will need. Each entry
    # names the upstream event that reopens the question. See
    # docs/adr/0018-dependency-update-policy.md.
    ignore:
      # ESLint 10: eslint-config-next 16.3.4 depends on eslint-plugin-react ^7.37.0, and 7.37.5
      # calls the context.getFilename() that ESLint 10 removed, so `web#lint` fails with
      # "contextOrFilename.getFilename is not a function". Revisit when
      # jsx-eslint/eslint-plugin-react#3977 ships.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # TypeScript 7's root export carries no classic compiler API, and typescript-eslint 8 peers
      # typescript <6.1.0. Revisit when typescript-eslint raises that peer; 6.0.x is the reachable
      # next step and gets its own pull request.
      - dependency-name: typescript
        versions: ['>=7']
      # Node types follow the runtime major in .nvmrc and move with it, by hand, so that a types
      # major cannot arrive ahead of the runtime. Revisit when .nvmrc changes major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # The order of the groups does not, by itself, keep a package in its own group: it decides only
    # between two groups that both keep a package, in a run where neither has an open pull request.
    # A group with no patterns never gives a dependency up, even to a group that names it exactly,
    # and outranks a wildcard pattern; a group with an open pull request claims its members, and
    # those recorded on the pull request, before the others run; and refreshing that pull request
    # takes every member. So a package with a group of its own is also in the `exclude-patterns` of
    # the catch-all group with the same `applies-to` (minor-and-patch or security), which Dependabot
    # reads before any pattern, and only a group whose update-types include minor and patch owns a
    # package this way. See docs/adr/0033-dependabot-group-exclusions.md.
    groups:
      # A security update of lighthouse itself is red by design for the reason given at the
      # `lighthouse` group below, so it gets its own security pull request instead of turning the
      # batch red and holding every other security fix.
      lighthouse-security:
        applies-to: security-updates
        patterns: ['lighthouse']
      # Security updates are triggered by alerts, not the Monday schedule. This batches each run's
      # security updates into one pull request, so several advisories arriving together cannot fill
      # the five-slot cap. Automated security updates are switched on in the repository settings only
      # after the pull request that cleared the lockfile's advisories (#71) has merged; see
      # docs/adr/0018-dependency-update-policy.md.
      security:
        applies-to: security-updates
        patterns: ['*']
        exclude-patterns: ['lighthouse']
      # The vite family moves as one: @vitejs/plugin-react 6 peers vite ^8, which is why #9 failed
      # when it arrived alone against vite 7, and vitest and @vitest/coverage-v8 peer on each
      # other's exact version. Majors are included so that they arrive together in one pull
      # request. See docs/adr/0018-dependency-update-policy.md.
      vite:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*']
        update-types: [major, minor, patch]
      # lighthouse is pinned exactly in apps/web/package.json, and the Lighthouse audit spec fails
      # on any version other than LIGHTHOUSE_VERSION in apps/web/e2e/support/lighthouse.ts until
      # someone re-reads the audit ids and scoring rules it asserts (.claude/rules/dependencies.md).
      # A bump is red by design, so it arrives alone rather than inside minor-and-patch, where it
      # would hold every other minor and patch bump. `update-types` lists every level, which is
      # also the default, to match vite and to say that a major comes through this group too. The
      # pattern matches the exact name only: lighthouse-logger and the rest of its tree are
      # transitive and change only when a lighthouse bump requires it.
      lighthouse:
        patterns: ['lighthouse']
        update-types: [major, minor, patch]
      # Every other minor and patch version update. The exclusions repeat the patterns of `vite` and
      # `lighthouse`: without them this group took both families' bumps in #232.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*', 'lighthouse']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
