<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <!-- Noise filter -->
    <filter id="noiseFilter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="5" seed="15"/>
      <feColorMatrix type="saturate" values="2.5"/>
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <!-- Star glow filters -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigStarGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Nebula gradients (CSS layer simulation) -->
    <radialGradient id="nebulaA" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#5b21b6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaB" cx="65%" cy="25%" r="28%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaC" cx="50%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm accent -->
    <radialGradient id="warmAccent" cx="80%" cy="60%" r="20%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom fade -->
    <linearGradient id="bottomFade" x1="0" y1="0.72" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>

    <!-- Card glow -->
    <filter id="cardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="900" fill="#0a0a0a"/>

  <!-- Noise texture layer (CSS equivalent) -->
  <rect width="1440" height="900" fill="#150a25" opacity="0.25" filter="url(#noiseFilter)"/>

  <!-- CSS Nebula gradients -->
  <rect width="1440" height="900" fill="url(#nebulaA)"/>
  <rect width="1440" height="900" fill="url(#nebulaB)"/>
  <rect width="1440" height="900" fill="url(#nebulaC)"/>
  <rect width="1440" height="900" fill="url(#warmAccent)"/>

  <!-- Canvas star layer: deep (small, dim) -->
  <g opacity="0.25">
    <circle cx="95" cy="55" r="0.5" fill="#cbd5e1"/>
    <circle cx="215" cy="130" r="0.5" fill="#e2e8f0"/>
    <circle cx="380" cy="85" r="0.5" fill="#cbd5e1"/>
    <circle cx="520" cy="170" r="0.5" fill="#e2e8f0"/>
    <circle cx="690" cy="45" r="0.5" fill="#cbd5e1"/>
    <circle cx="830" cy="110" r="0.5" fill="#e2e8f0"/>
    <circle cx="980" cy="75" r="0.5" fill="#cbd5e1"/>
    <circle cx="1130" cy="155" r="0.5" fill="#e2e8f0"/>
    <circle cx="1280" cy="95" r="0.5" fill="#cbd5e1"/>
    <circle cx="1400" cy="180" r="0.5" fill="#e2e8f0"/>
    <circle cx="150" cy="350" r="0.5" fill="#cbd5e1"/>
    <circle cx="310" cy="450" r="0.5" fill="#e2e8f0"/>
    <circle cx="480" cy="520" r="0.5" fill="#cbd5e1"/>
    <circle cx="750" cy="620" r="0.5" fill="#e2e8f0"/>
    <circle cx="1050" cy="400" r="0.5" fill="#cbd5e1"/>
    <circle cx="1200" cy="550" r="0.5" fill="#e2e8f0"/>
    <circle cx="1380" cy="480" r="0.5" fill="#cbd5e1"/>
    <circle cx="60" cy="680" r="0.5" fill="#e2e8f0"/>
    <circle cx="900" cy="700" r="0.5" fill="#cbd5e1"/>
    <circle cx="600" cy="300" r="0.5" fill="#e2e8f0"/>
  </g>

  <!-- Canvas star layer: mid -->
  <g opacity="0.5">
    <circle cx="160" cy="95" r="0.8" fill="#e2e8f0" filter="url(#starGlow)"/>
    <circle cx="420" cy="220" r="0.7" fill="#c4b5fd"/>
    <circle cx="750" cy="100" r="0.9" fill="#e2e8f0" filter="url(#starGlow)"/>
    <circle cx="1050" cy="200" r="0.7" fill="#a5b4fc"/>
    <circle cx="1300" cy="130" r="0.8" fill="#e2e8f0" filter="url(#starGlow)"/>
    <circle cx="250" cy="480" r="0.7" fill="#c4b5fd"/>
    <circle cx="1150" cy="420" r="0.9" fill="#e2e8f0" filter="url(#starGlow)"/>
    <circle cx="550" cy="650" r="0.7" fill="#a5b4fc"/>
    <circle cx="850" cy="550" r="0.8" fill="#e2e8f0"/>
    <circle cx="1380" cy="350" r="0.7" fill="#c4b5fd" filter="url(#starGlow)"/>
  </g>

  <!-- Canvas star layer: bright (large, glowing, depth-of-field) -->
  <g opacity="0.7">
    <circle cx="250" cy="160" r="1.8" fill="#f8fafc" filter="url(#bigStarGlow)"/>
    <circle cx="880" cy="130" r="2.2" fill="#ddd6fe" filter="url(#bigStarGlow)"/>
    <circle cx="1250" cy="220" r="1.5" fill="#f8fafc" filter="url(#bigStarGlow)"/>
    <circle cx="500" cy="380" r="1.6" fill="#a5f3fc" filter="url(#bigStarGlow)"/>
    <circle cx="1100" cy="500" r="1.8" fill="#f8fafc" filter="url(#bigStarGlow)"/>
    <circle cx="150" cy="550" r="1.4" fill="#ddd6fe" filter="url(#bigStarGlow)"/>
  </g>

  <!-- Terminal Card -->
  <g transform="translate(520, 230)" filter="url(#cardGlow)">
    <rect width="400" height="180" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <rect width="400" height="32" rx="8" fill="#161b22"/>
    <rect x="0" y="24" width="400" height="8" fill="#161b22"/>
    <line x1="0" y1="32" x2="400" y2="32" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>

    <text x="20" y="60" font-family="monospace" font-size="11" fill="#6b7280">PLAYER</text>
    <text x="380" y="60" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="end">Milos Cvetkovic</text>

    <text x="20" y="88" font-family="monospace" font-size="11" fill="#6b7280">CLASS</text>
    <text x="380" y="88" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="end">AI-Native Engineer</text>

    <text x="20" y="116" font-family="monospace" font-size="11" fill="#6b7280">LEVEL</text>
    <text x="380" y="116" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="end">10+ years</text>

    <line x1="20" y1="130" x2="380" y2="130" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="155" font-family="monospace" font-size="11" fill="#6b7280">STATUS</text>
    <circle cx="340" cy="151" r="4" fill="#4ade80"/>
    <text x="380" y="155" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="end">Ready</text>
  </g>

  <!-- Notification toast -->
  <g transform="translate(520, 430)">
    <rect width="400" height="40" rx="8" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#8b5cf6">⚡ NEW QUEST RECEIVED</text>
  </g>

  <!-- Headline -->
  <text x="720" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc" text-anchor="middle">Most engineers show you</text>
  <text x="720" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc" text-anchor="middle">the finished product.</text>

  <text x="620" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">I'll show you how the sausage gets made.</text>
  <text x="820" y="625" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8b5cf6" font-weight="600" text-anchor="middle">Scroll to watch me work.</text>

  <!-- Bottom fade -->
  <rect width="1440" height="900" fill="url(#bottomFade)"/>

  <!-- Label -->
  <rect x="20" y="20" width="340" height="36" rx="6" fill="#f59e0b" opacity="0.9"/>
  <text x="36" y="43" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">APPROACH C: Hybrid (CSS Nebula + Canvas Stars)</text>
</svg>