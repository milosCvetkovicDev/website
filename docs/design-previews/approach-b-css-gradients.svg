<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <!-- SVG noise filter -->
    <filter id="noiseFilter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- Soft glow for card -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.08" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle top gradient -->
    <radialGradient id="topGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0f0a1a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent glow behind card -->
    <radialGradient id="cardBackGlow" cx="50%" cy="40%" r="20%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom fade -->
    <linearGradient id="bottomFade" x1="0" y1="0.75" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>

    <!-- Dot pattern for subtle stars -->
    <pattern id="dotPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="0.5" fill="#e2e8f0" opacity="0.15"/>
    </pattern>

    <pattern id="dotPattern2" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="30" r="0.3" fill="#c4b5fd" opacity="0.2"/>
      <circle cx="20" cy="90" r="0.4" fill="#e2e8f0" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1440" height="900" fill="#0a0a0a"/>

  <!-- Very subtle noise overlay -->
  <rect width="1440" height="900" filter="url(#noiseFilter)" opacity="0.02"/>

  <!-- Top atmospheric glow -->
  <rect width="1440" height="900" fill="url(#topGlow)"/>

  <!-- Subtle accent glow behind card area -->
  <rect width="1440" height="900" fill="url(#cardBackGlow)"/>

  <!-- Dot patterns for minimal star effect -->
  <rect width="1440" height="900" fill="url(#dotPattern)" opacity="0.4"/>
  <rect width="1440" height="900" fill="url(#dotPattern2)" opacity="0.3"/>

  <!-- Very subtle left accent -->
  <ellipse cx="200" cy="400" rx="200" ry="300" fill="#7c3aed" opacity="0.02"/>

  <!-- Very subtle right accent -->
  <ellipse cx="1200" cy="350" rx="180" ry="250" fill="#4338ca" opacity="0.02"/>

  <!-- Terminal Card -->
  <g transform="translate(520, 250)" filter="url(#softGlow)">
    <rect width="400" height="180" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <rect width="400" height="32" rx="8" fill="#161b22"/>
    <rect x="0" y="24" width="400" height="8" fill="#161b22"/>
    <line x1="0" y1="32" x2="400" y2="32" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#27c93f"/>

    <text x="20" y="60" font-family="monospace" font-size="11" fill="#6b7280">PLAYER</text>
    <text x="380" y="60" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="end">Milos Cvetkovic</text>

    <text x="20" y="88" font-family="monospace" font-size="11" fill="#6b7280">CLASS</text>
    <text x="380" y="88" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="end">AI-Native Engineer</text>

    <text x="20" y="116" font-family="monospace" font-size="11" fill="#6b7280">LEVEL</text>
    <text x="380" y="116" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="end">10+ years</text>

    <line x1="20" y1="130" x2="380" y2="130" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="155" font-family="monospace" font-size="11" fill="#6b7280">STATUS</text>
    <circle cx="340" cy="151" r="4" fill="#4ade80"/>
    <text x="380" y="155" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="end">Ready</text>
  </g>

  <!-- Notification toast -->
  <g transform="translate(520, 450)">
    <rect width="400" height="40" rx="8" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="20" y="25" font-family="monospace" font-size="12" fill="#8b5cf6">⚡ NEW QUEST RECEIVED</text>
  </g>

  <!-- Headline -->
  <text x="720" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc" text-anchor="middle">Most engineers show you</text>
  <text x="720" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="bold" fill="#f8fafc" text-anchor="middle">the finished product.</text>

  <text x="620" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">I'll show you how the sausage gets made.</text>
  <text x="820" y="645" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8b5cf6" font-weight="600" text-anchor="middle">Scroll to watch me work.</text>

  <!-- Bottom fade -->
  <rect width="1440" height="900" fill="url(#bottomFade)"/>

  <!-- Label -->
  <rect x="20" y="20" width="280" height="36" rx="6" fill="#06b6d4" opacity="0.9"/>
  <text x="36" y="43" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="white">APPROACH B: CSS Gradients + Noise</text>
</svg>